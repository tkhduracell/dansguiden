name: Mobile Android Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build web app
        working-directory: apps/mobile
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate throwaway debug signing keystore
        working-directory: apps/mobile/android
        run: |
          cat > google_play_keystore.properties <<'EOF'
          keyAlias=debug
          keyPassword=debugdebug
          storePassword=debugdebug
          EOF
          keytool -genkeypair -v -keystore google_play_keystore.key -alias debug \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass debugdebug -keypass debugdebug \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
