name: Firebase Hosting Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Probe FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "len=${#FIREBASE_TOKEN}"
          echo "first_byte_hex=$(printf '%s' "$FIREBASE_TOKEN" | head -c 1 | xxd -p)"
          echo "last_4_bytes_hex=$(printf '%s' "$FIREBASE_TOKEN" | tail -c 4 | xxd -p)"
          echo "sha256_prefix=$(printf '%s' "$FIREBASE_TOKEN" | sha256sum | cut -c1-16)"

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}